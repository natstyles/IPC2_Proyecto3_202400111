<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tecnologías Chapinas S.A.{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #222;
            color: #fff;
            padding: 15px;
        }
        nav a {
            color: #fff;
            margin-right: 20px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tecnologías Chapinas S.A.</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="/recursos/">Recursos</a>
            <a href="/clientes/">Clientes</a>
            <a href="/instancias/">Instancias</a>
            <a href="/configuracion/subir/">Subir Configuración</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- CONTENT -->
        {% endblock %}
    </main>

    <footer>
        Richard Arizandieta - 2025
    </footer>
</body>
</html>
