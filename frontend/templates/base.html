<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tecnologías Chapinas S.A.{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #222;
            color: #fff;
            padding: 15px;
        }
        nav a {
            color: #fff;
            margin-right: 20px;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }
        
        /* === ESTILO GENERAL DE ALERTAS === */
        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* === Colores según tipo === */
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* === Animación sutil === */
        .alert {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Tecnologías Chapinas S.A.</h1>
        <nav>
            <a href="/">Inicio</a>
            <a href="/recursos/">Recursos</a>
            <a href="/clientes/">Clientes</a>
            <a href="/configuraciones/">Configuraciones</a>
            <a href="/instancias/">Instancias</a>
            <a href="/facturas/">Facturación</a>
            <a href="{% url 'cargar_configuracion' %}">Subir Configuración</a>
        </nav>
    </header>

    <main>
        {% block content %}
        <!-- CONTENT -->
        {% endblock %}
    </main>

    <footer>
        Richard Arizandieta - 2025
    </footer>
</body>
</html>
