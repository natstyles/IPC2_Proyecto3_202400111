{% extends "base.html" %}

{% block title %}Nueva configuración{% endblock %}

{% block content %}
<h2>Nueva Configuración</h2>

<form method="post">
    {% csrf_token %}
    <label>Nombre:</label>
    <input type="text" name="nombre" required><br>

    <label>Descripción:</label>
    <input type="text" name="descripcion" required><br>

    <label>Categoría:</label>
    <select name="categoria_id" required>
        {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nombre }}</option>
        {% endfor %}
    </select><br>

    <h4>Recursos disponibles</h4>
    {% for recurso in recursos %}
        <label>{{ recurso.nombre }} ({{ recurso.unidad }}):</label>
        <input type="number" step="0.1" min="0" name="cantidad_{{ recurso.id }}">
        <br>
    {% endfor %}

    <button type="submit">Crear configuración</button>
</form>

{% endblock %}
