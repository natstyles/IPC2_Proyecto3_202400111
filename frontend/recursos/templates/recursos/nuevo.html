<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Recurso</title>
</head>
<body>
    <h1>Crear Nuevo Recurso</h1>
    <form method="POST">
        {% csrf_token %}
        <label>Nombre:</label><br>
        <input type="text" name="nombre" required><br>

        <label>Abreviatura:</label><br>
        <input type="text" name="abreviatura" required><br>

        <label>Métrica:</label><br>
        <input type="text" name="metrica" required><br>

        <label>Tipo:</label><br>
        <input type="text" name="tipo" required><br>

        <label>Valor por hora:</label><br>
        <input type="number" step="0.01" name="valor_x_hora" required><br><br>

        <button type="submit">Guardar</button>
    </form>
</body>
</html>
