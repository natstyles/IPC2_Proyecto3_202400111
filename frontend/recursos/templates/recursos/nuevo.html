<!DOCTYPE html>
{% extends "base.html" %}

{% block title %}Nuevo Recurso{% endblock %}

{% block content %}

<!--ERRORES & ALERTS-->

{% if error %}
<div class="alert alert-error">
    ⚠️ {{ error }}
</div>
{% endif %}

{% if warning %}
<div class="alert alert-warning">
    ⚠️ {{ warning }}
</div>
{% endif %}

{% if info %}
<div class="alert alert-info">
    ℹ️ {{ info }}
</div>
{% endif %}

<h2>Crear Nuevo Recurso</h2>
    <form method="POST">
        {% csrf_token %}
        <label>Nombre:</label><br>
        <input type="text" name="nombre" required><br>

        <label>Abreviatura:</label><br>
        <input type="text" name="abreviatura" required><br>

        <label>Métrica:</label><br>
        <input type="text" name="metrica" required><br>

        <label>Tipo:</label><br>
        <input type="text" name="tipo" required><br>

        <label>Valor por hora:</label><br>
        <input type="number" step="0.01" name="valor_x_hora" required><br><br>

        <button type="submit">Guardar</button>
    </form>
{% endblock %}
