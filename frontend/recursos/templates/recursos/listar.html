<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de Recursos</title>
</head>
<body>
    <h1>Recursos Disponibles</h1>

    <a href="{% url 'crear_recurso' %}">Nuevo Recurso</a>

    <table border="1" cellpadding="6">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Abreviatura</th>
            <th>Métrica</th>
            <th>Tipo</th>
            <th>Valor x Hora</th>
            <th>Acciones</th>
        </tr>
        {% for r in recursos %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.nombre }}</td>
            <td>{{ r.abreviatura }}</td>
            <td>{{ r.metrica }}</td>
            <td>{{ r.tipo }}</td>
            <td>{{ r.valor_x_hora }}</td>
            <td>
                <a href="{% url 'eliminar_recurso' r.id %}">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
